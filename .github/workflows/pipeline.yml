# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
env:
  REGISTRY: docker.io
jobs:
  ci-fe:
    name: CI FE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FE/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Build FE
        run: npm run build
  ci-be:
    name: CI BE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BE/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Build BE
        run: npm run build

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [ci-fe, ci-be]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive lowercase image names
        id: vars
        shell: bash
        run: |
          DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "fe_image=${{ env.REGISTRY }}/$DOCKERHUB_USER/tastebite-fe" >> "$GITHUB_OUTPUT"
          echo "be_image=${{ env.REGISTRY }}/$DOCKERHUB_USER/tastebite-be" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push FE image
        uses: docker/build-push-action@v7
        with:
          context: FE
          file: FE/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.fe_image }}:latest
            ${{ steps.vars.outputs.fe_image }}:${{ github.sha }}

      - name: Build and push image BE
        uses: docker/build-push-action@v7
        with:
          context: BE
          file: BE/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.be_image }}:latest
            ${{ steps.vars.outputs.be_image }}:${{ github.sha }}

  pull-and-deploy:
    name: Pull and Deploy FE + BE + DB
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' &&  github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive lowercase image names
        id: vars
        shell: bash
        run: |
          DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "fe_image=${{ env.REGISTRY }}/$DOCKERHUB_USER/tastebite-fe" >> "$GITHUB_OUTPUT"
          echo "be_image=${{ env.REGISTRY }}/$DOCKERHUB_USER/tastebite-be" >> "$GITHUB_OUTPUT"

      - name: Ensure deploy folder exist on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p "${{ secrets.VPS_DEPLOY_PATH }}"

      - name: Copy Docker Compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: deploy/docker-compose.yml
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1

      - name: Pull and run stack on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            FE_IMAGE="${{ steps.vars.outputs.fe_iamge }}:${{ github.sha }}"
            BE_IMAGE="${{ steps.vars.outputs.be_iamge }}:${{ github.sha }}"

            cd ${{ secrets.VPS_DEPLOY_PATH }}
            {
              echo "FE_IMAGE=$FE_IMAGE"
              echo "BE_IMAGE=$BE_IMAGE"
            } > .env

            if [ -n "${{ secrets.ENV }}" ]; then
              printf "\n%s\n" "${{ secrets.ENV }}" >> .env
            fi

            : > .env.be
            if [ -n "${{ secrets.ENV_BE }}" ]; then
              printf "%s\n" "${{ secrets.ENV_BE }}" > .env.be
            fi

            : > .env.fe
            if [ -n "${{ secrets.ENV_FE }}" ]; then
              printf "%s\n" "${{ secrets.ENV_FE }}" > .env.fe
            fi

            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

            docker compose -f docker-compose.yml run --rm --no-deps be npm run migration:run
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
