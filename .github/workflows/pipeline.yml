# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
env:
  REGISTRY: docker.io
jobs:
  ci-fe:
    name: CI FE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
        
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Nodejs
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: FE/package.json
        
    - name: Install Dependencies
      run: npm ci

    - name: Build FE
      run: npm run build
  ci-be:
    name: CI BE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BE/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Build BE
        run: npm run build
